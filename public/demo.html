<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay — Demo Control Panel</title>

  <!-- Favicon Data URI -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231d4ed8'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">

  <!-- App Styles -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .demo-container {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .demo-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .demo-key-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .demo-key-bar label {
      font-weight: 700;
      font-size: 0.9rem;
      color: #0f172a;
    }

    .demo-key-bar input {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
      min-height: 44px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .btn-action {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      min-height: 72px;
    }

    .btn-action:hover {
      border-color: var(--primary-color);
      background: #f0f9ff;
      box-shadow: var(--shadow-sm);
    }

    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: var(--border-color);
      background: #f1f5f9;
    }

    .btn-action .title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action .desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-run-all {
      grid-column: 1 / -1;
      background: #047857;
      color: #ffffff;
      border-color: #065f46;
    }

    .btn-run-all:hover {
      background: #065f46;
      color: #ffffff;
    }

    .btn-run-all .title {
      color: #ffffff;
    }

    .btn-run-all .desc {
      color: #a7f3d0;
    }

    .response-log {
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 380px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-entry {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }

    .log-status-200, .log-status-201 { color: #34d399; }
    .log-status-error { color: #f87171; }
  </style>
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="app-header" role="banner">
    <div class="header-brand">
      <svg class="brand-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      <div>
        <h1 class="brand-title">RELAY</h1>
        <span class="brand-subtitle">Demo Control Panel & Scripted Automation</span>
      </div>
    </div>
    <div class="header-status">
      <a href="/" style="color: #38bdf8; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Main App
      </a>
    </div>
  </header>

  <main class="demo-container">
    <div class="demo-card">
      <h2 style="font-size: 1.2rem; margin-bottom: 12px; color: #0f172a; display: flex; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Demo Authentication Header
      </h2>
      <div class="demo-key-bar">
        <label for="demo-key-input">Header <code style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">x-demo-key</code>:</label>
        <input type="password" id="demo-key-input" placeholder="Enter demo access key..." autocomplete="off">
        <span style="font-size: 0.8rem; color: var(--text-muted);">(Kept in memory only)</span>
      </div>
    </div>

    <div class="demo-card">
      <h2 style="font-size: 1.2rem; margin-bottom: 4px; color: #0f172a; display: flex; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4m-2-2v4m10-2h.01m-3 0h.01"/></svg>
        Deep-Path Scenario Controls
      </h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Triggers backend endpoints to demonstrate full case resolution lifecycle for video recording.
      </p>

      <div class="button-grid">
        <button id="btn-seed" class="btn-action">
          <span class="title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Seed Database
          </span>
          <span class="desc">POST /api/demo/seed (Inserts Agege, Mile 12, Ijegun baseline cases)</span>
        </button>

        <button id="btn-reset" class="btn-action">
          <span class="title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Reset Database
          </span>
          <span class="desc">POST /api/demo/reset (Clears all cases from memory/SQLite)</span>
        </button>

        <button id="btn-report-en" class="btn-action">
          <span class="title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Submit English Report
          </span>
          <span class="desc">POST /api/reports (Agege market armed men gathering signal)</span>
        </button>

        <button id="btn-report-pidgin" class="btn-action">
          <span class="title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            Submit Pidgin Corroboration
          </span>
          <span class="desc">POST /api/reports (Corroborating Agege Pidgin signal)</span>
        </button>

        <button id="btn-advance" class="btn-action">
          <span class="title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
            Advance Deep-Path Case
          </span>
          <span class="desc">POST /api/cases/:id/advance (Moves case through Accepted → Claimed)</span>
        </button>

        <button id="btn-verify" class="btn-action">
          <span class="title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            Third-Party Verification
          </span>
          <span class="desc">POST /api/cases/:id/verify (Confirms resolution T+61 min)</span>
        </button>

        <button id="btn-run-full" class="btn-action btn-run-all">
          <span class="title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 5.2l-1.4 1.4"/><path d="M12.2 10.8l-1.4 1.4"/><path d="M17.8 12.8l-1.4-1.4"/><path d="M12.2 7.2l-1.4-1.4"/></svg>
            Run Full Deep Path (Automated with Pauses)
          </span>
          <span class="desc">Executes Seed → English → Pidgin → Advance ×2 → Verification with 2.5s pauses for video recording.</span>
        </button>
      </div>
    </div>

    <div class="demo-card">
      <h2 style="font-size: 1.1rem; margin-bottom: 8px; color: #0f172a; display: flex; justify-content: space-between; align-items: center;">
        <span style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          API Response Output
        </span>
        <button id="btn-clear-log" class="btn btn-secondary btn-sm">Clear Log</button>
      </h2>
      <div id="response-log" class="response-log">Ready for demo actions...</div>
    </div>
  </main>

  <script>
    // Demo key stored strictly in JS memory variable
    let demoKey = '';
    let deepPathCaseId = null;

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.getElementById('demo-key-input').addEventListener('input', (e) => {
      demoKey = e.target.value.trim();
    });

    const logEl = document.getElementById('response-log');

    function appendLog(action, status, data) {
      const timestamp = new Date().toLocaleTimeString();
      const isSuccess = status >= 200 && status < 300;
      const statusClass = isSuccess ? 'log-status-200' : 'log-status-error';

      const entryDiv = document.createElement('div');
      entryDiv.className = 'log-entry';

      const headerDiv = document.createElement('div');
      headerDiv.innerHTML = `[${escapeHtml(timestamp)}] <strong>${escapeHtml(action)}</strong> - <span class="${statusClass}">HTTP ${status}</span>`;

      const preEl = document.createElement('pre');
      preEl.style.cssText = 'margin-top:4px; font-size:0.8rem; color:#94a3b8;';
      preEl.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);

      entryDiv.appendChild(headerDiv);
      entryDiv.appendChild(preEl);

      if (logEl.textContent === 'Ready for demo actions...') {
        logEl.innerHTML = '';
      }
      logEl.insertBefore(entryDiv, logEl.firstChild);
    }

    async function makeRequest(endpoint, method = 'POST', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (demoKey) {
        headers['x-demo-key'] = demoKey;
      }

      try {
        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);

        const res = await fetch(endpoint, opts);
        const data = await res.json().catch(() => ({ note: 'No JSON body returned' }));
        appendLog(`${method} ${endpoint}`, res.status, data);

        // Store active deep path case ID if returned
        if (data && data.case && data.case.id) {
          deepPathCaseId = data.case.id;
        } else if (data && data.id) {
          deepPathCaseId = data.id;
        }

        return { ok: res.ok, status: res.status, data };
      } catch (err) {
        appendLog(`${method} ${endpoint}`, 0, { error: err.message });
        return { ok: false, status: 0, data: { error: err.message } };
      }
    }

    // Button Listeners
    document.getElementById('btn-clear-log').addEventListener('click', () => {
      logEl.textContent = 'Ready for demo actions...';
    });

    document.getElementById('btn-seed').addEventListener('click', () => {
      makeRequest('/api/demo/seed');
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      deepPathCaseId = null;
      makeRequest('/api/demo/reset');
    });

    document.getElementById('btn-report-en').addEventListener('click', () => {
      makeRequest('/api/reports', 'POST', {
        text: 'There is a group of armed men gathering near the Agege market entrance, by the bus stop. People are scared and shops are closing early. This is happening right now.',
        lat: 6.6212,
        lng: 3.3262
      });
    });

    document.getElementById('btn-report-pidgin').addEventListener('click', () => {
      makeRequest('/api/reports', 'POST', {
        text: 'Wetin dey happen for Agege market na serious o. Some men with weapon dey near di bus stop, everybody dey run comot.',
        lat: 6.6212,
        lng: 3.3262
      });
    });

    document.getElementById('btn-advance').addEventListener('click', async () => {
      let targetId = deepPathCaseId;
      if (!targetId) {
        // Find latest case
        const casesRes = await makeRequest('/api/cases', 'GET');
        if (casesRes.ok && casesRes.data && casesRes.data.cases && casesRes.data.cases.length > 0) {
          targetId = casesRes.data.cases[0].id;
        }
      }
      if (!targetId) targetId = 'RLA-1001';
      makeRequest(`/api/cases/${targetId}/advance`, 'POST', { minutes_elapsed: 15 });
    });

    document.getElementById('btn-verify').addEventListener('click', async () => {
      let targetId = deepPathCaseId;
      if (!targetId) {
        const casesRes = await makeRequest('/api/cases', 'GET');
        if (casesRes.ok && casesRes.data && casesRes.data.cases && casesRes.data.cases.length > 0) {
          targetId = casesRes.data.cases[0].id;
        }
      }
      if (!targetId) targetId = 'RLA-1001';
      makeRequest(`/api/cases/${targetId}/verify`, 'POST', {
        text: 'Confirmed by 3rd community member: area clear and calm, responders dispersed group without injuries.'
      });
    });

    // Run Full Deep Path Script
    document.getElementById('btn-run-full').addEventListener('click', async () => {
      const runBtn = document.getElementById('btn-run-full');
      runBtn.disabled = true;
      const originalText = runBtn.innerHTML;
      runBtn.innerHTML = '<span class="title"><i class="fa-solid fa-spinner fa-spin"></i> Running Full Deep Path...</span>';

      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      try {
        appendLog('AUTOMATION START', 200, { step: '1/6: Resetting database' });
        await makeRequest('/api/demo/reset');
        await sleep(2500);

        appendLog('AUTOMATION STEP 2', 200, { step: '2/6: Submitting English report' });
        const enRes = await makeRequest('/api/reports', 'POST', {
          text: 'There is a group of armed men gathering near the Agege market entrance, by the bus stop. People are scared and shops are closing early. This is happening right now.',
          lat: 6.6212,
          lng: 3.3262
        });
        const activeCaseId = (enRes.data && enRes.data.case && enRes.data.case.id) ? enRes.data.case.id : 'RLA-1001';
        await sleep(2500);

        appendLog('AUTOMATION STEP 3', 200, { step: '3/6: Submitting Pidgin corroboration' });
        await makeRequest('/api/reports', 'POST', {
          text: 'Wetin dey happen for Agege market na serious o. Some men with weapon dey near di bus stop, everybody dey run comot.',
          lat: 6.6212,
          lng: 3.3262
        });
        await sleep(2500);

        appendLog('AUTOMATION STEP 4', 200, { step: '4/6: Advancing case (In Progress)' });
        await makeRequest(`/api/cases/${activeCaseId}/advance`, 'POST', { action: 'Patrol dispatched to Agege market entrance', minutes_elapsed: 25 });
        await sleep(2500);

        appendLog('AUTOMATION STEP 5', 200, { step: '5/6: Advancing case (Claimed Resolved)' });
        await makeRequest(`/api/cases/${activeCaseId}/advance`, 'POST', { action: 'Responders dispersed the group, no injuries', minutes_elapsed: 35 });
        await sleep(2500);

        appendLog('AUTOMATION STEP 6', 200, { step: '6/6: Submitting third-party verification' });
        await makeRequest(`/api/cases/${activeCaseId}/verify`, 'POST', {
          text: 'Confirmed by 3rd community member: area clear and calm, responders dispersed group without injuries.'
        });

        appendLog('AUTOMATION COMPLETE', 200, { message: 'Deep path full lifecycle finished successfully!' });
      } catch (err) {
        appendLog('AUTOMATION ERROR', 0, { error: err.message });
      } finally {
        runBtn.disabled = false;
        runBtn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
